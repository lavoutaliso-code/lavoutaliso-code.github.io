<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta name="robots" content="noindex,nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laila Salon</title>
<meta name="theme-color" content="#FFFFFF">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   LAILA SALON — a casca do sistema à venda, com a lateral C aprovada.

   ⚠️ É CÓPIA, NUNCA O ORIGINAL. O PDV e o interno que o salão dela usa todo
      dia continuam onde estão, intocados.

   ⚠️ CADA ABA RODA NUM IFRAME, e isso é decisão. O PDV tem 11.627 linhas e o
      interno outros tantos; os dois declaram globais de mesmo nome (`DBURL`,
      `brl`, `_hoje`) e os DOIS têm um `salao.js`. Fundir num documento só
      seria colisão garantida.

   🔴 ERRO MEU: eu chamei DUAS coisas de "C" na aprovação — uma com faixa
      escura e outra com a lateral toda branca. Ela aprovou "o C" e eu subi a
      errada. *"não foi essa logo de fundo preto que aprovei"*.
      Agora a lateral é branca de ponta a ponta.
   ⚠️ O "salon" vai em grafite, e não em branco, porque branco sobre branco dá
      contraste de 1,00:1 — a palavra simplesmente não aparece na tela.
   ══════════════════════════════════════════════════════════════════════════ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --rosa:#D1016B; --grafite:#17181C;
  --tinta:#17181C; --tinta2:#6B7280; --tinta3:#9DA4AE;
  --linha:#ECEEF1; --hover:#F5F6F8; --bg:#F4F6F8;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--tinta);-webkit-font-smoothing:antialiased;
  display:flex;overflow:hidden}

/* ── a lateral ─────────────────────────────────────────────────────────── */
#lado{width:276px;flex:none;background:#fff;height:100vh;display:flex;
  flex-direction:column;border-right:1px solid var(--linha);z-index:35}
.marca{height:88px;padding:0 22px;background:#fff;border-bottom:1px solid var(--linha);
  display:flex;align-items:center;flex:none}
.marca img{height:25px;width:auto;display:block}

#busca{flex:none;padding:14px 16px 10px}
#busca .cx{display:flex;align-items:center;gap:9px;background:var(--hover);
  border:1px solid transparent;border-radius:11px;padding:9px 12px;transition:.15s}
#busca .cx:focus-within{background:#fff;border-color:#F4C2DB;
  box-shadow:0 0 0 3px rgba(209,1,107,.09)}
#busca svg{color:var(--tinta3);flex:none}
#busca input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:inherit;
  font-size:13.5px;color:var(--tinta)}
#busca input::placeholder{color:var(--tinta3)}

#menu{flex:1;overflow-y:auto;padding:0 12px 20px}
/* ⚠️ sticky com fundo OPACO e margem negativa do padding do pai: sem o fundo,
   os itens passam por baixo e o cabeçalho vira um borrão */
.cab{position:sticky;top:0;z-index:2;background:#fff;margin:0 -12px;padding:12px 24px 7px;
  font-size:10.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:var(--tinta3)}
.item{width:100%;display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;
  border-radius:10px;background:none;color:var(--tinta2);font-family:inherit;font-size:13.5px;
  font-weight:500;cursor:pointer;text-align:left;letter-spacing:-.01em}
.item:hover{background:var(--hover);color:var(--tinta)}
.item.on{background:#FDE9F2;color:var(--rosa);font-weight:600}
.item svg{flex:none;opacity:.9}
.item[disabled]{opacity:.55;cursor:default}
.item[disabled]:hover{background:none;color:var(--tinta2)}
.breve{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:#9A6B00;background:#FFF6E0;border:1px solid #F2DFA8;border-radius:5px;
  padding:1px 5px;margin-left:auto;flex:none}
.vazio{padding:26px 14px;text-align:center;font-size:12.5px;color:var(--tinta3)}

#pe{flex:none;padding:13px 20px 16px;border-top:1px solid var(--linha);
  font-size:11.5px;color:var(--tinta3);line-height:1.45}
#pe b{display:block;color:var(--tinta);font-size:12.5px;font-weight:600;margin-bottom:1px}

/* ── o palco ───────────────────────────────────────────────────────────── */
#palco{flex:1;min-width:0;height:100vh;position:relative;background:var(--bg)}
#palco iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
#palco iframe.on{display:block}
#carregando{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--tinta3);font-size:14px}

/* ── no tablet em pé a lateral vira gaveta ────────────────────────────── */
#abrir{display:none;position:fixed;left:14px;top:14px;z-index:40;width:44px;height:44px;
  border-radius:13px;border:0;background:var(--grafite);color:#fff;cursor:pointer;
  align-items:center;justify-content:center;box-shadow:0 8px 20px -8px rgba(15,30,40,.6)}
#veu{display:none;position:fixed;inset:0;background:rgba(15,30,40,.4);z-index:30}
@media (max-width:1024px){
  #lado{position:fixed;left:0;top:0;transform:translateX(-100%);
    transition:transform .26s cubic-bezier(.22,1,.36,1)}
  body.menu #lado{transform:none}
  body.menu #veu{display:block}
  #abrir{display:flex}
}
</style>
<style>
/* ══ A LATERAL RECOLHIDA ═══════════════════════════════════════════════
   Ela, 12/11: *«a barra lateral só abre se clicar nos três pontos, fora
   isso o sistema fica maior e ocupa toda a tela»*. A lateral deixa de
   empurrar o conteúdo: ela sai da largura (width:0) e volta FLUTUANDO
   por cima quando aberta — assim o sistema ganha os 276px inteiros, não
   só «quase». */
#lado{transition:width .18s ease}
body.lsRecolhe #lado{width:0;overflow:hidden;border:0}
body.lsRecolhe #palco{padding-left:58px}
body.lsRecolhe.lsAberta #lado{position:fixed;left:0;top:0;z-index:60;width:276px;
  overflow:visible;box-shadow:0 0 0 1px #E9E9EE, 0 24px 60px -24px rgba(9,55,84,.34)}
#lsPontos{position:fixed;left:14px;top:14px;z-index:70;width:40px;height:40px;
  border-radius:12px;border:1px solid #E9E9EE;background:#fff;cursor:pointer;
  display:none;align-items:center;justify-content:center;gap:4px;padding:0}
body.lsRecolhe #lsPontos{display:flex}
body.lsRecolhe.lsAberta #lsPontos{left:290px}
/* ⭐ Ela, 12/11: *«troque esses três pontos da tela por uma barra de 3
   premium nativa»*. Três pontos é o menu «mais opções» do iOS; três
   barras é o menu de navegação — que é o que este botão faz. As barras
   têm o traço do sistema (1,8px, ponta arredondada) e a de baixo é mais
   curta: é o detalhe que separa o ícone nativo do ícone genérico. */
/* ⚠️ A primeira versão saiu TORTA e o print mostrou: eu pus
   `align-self:flex-start` na barra de baixo dentro de um flex que estava
   centralizado — ela escapou da caixa pela esquerda. Três barras iguais,
   alinhadas por um container de largura fixa. Sem gracinha. */
#lsPontos{flex-direction:column;align-items:center;justify-content:center;gap:4px!important}
#lsPontos i{width:16px;height:1.7px;border-radius:2px;background:#0D0D10;display:block}
/* ══ A TELA TRAVADA ════════════════════════════════════════════════════
   ⚠️ Não é «desabilitado e pronto»: botão apagado sem explicação parece
   defeito. O cadeado diz que está fechado DE PROPÓSITO, e o `title`
   diz até quando. O item não some da lista porque ela precisa ver que
   a tela existe — só ainda não passou pelo rebranding. */
.item.travada{opacity:1;color:#A9A9B4;cursor:not-allowed}
.item.travada svg:not(.cad){opacity:.5}
.item.travada .cad{margin-left:auto;color:#C2C2CC;flex:none}
.item.travada:hover{background:transparent}

#lsVeu{position:fixed;inset:0;z-index:55;background:rgba(13,13,16,.18);display:none}

/* ══ A MARCA FIXA, EM TODA TELA ═════════════════════════════════════════
   Ela, 12/11: *«todas as telas têm que ter aquela logo do laila salon
   fixa»*. Cada tela é um iframe — colar a logo dentro de cada uma seria
   repetir o trabalho 20 vezes e esquecer na 21ª. A barra mora na CASCA,
   por fora dos iframes: toda tela que abrir nasce com a marca em cima.

   ⚠️ A barra come 46px de altura, e ela acabou de pedir o sistema MAIOR.
   Compensa: os três pontos saíram da lateral esquerda e vieram para a
   barra, então o `#palco` devolve os 58px de recuo — o sistema fica mais
   largo do que estava, e perde só a faixa da marca. */
/* ⚠️ Ela, 12/11: *«não deixa essa barra separando a tela do topo não,
   faz ele ser topo infinito»*. A barra era branca e a tela abaixo dela
   também é branca — o que separava as duas era UM fio de 1px. Tirado o
   fio, o branco corre do topo até o conteúdo sem costura, e a barra
   deixa de parecer uma peça colada em cima da tela. */
#lsTopo{position:fixed;top:0;left:0;right:0;height:46px;z-index:66;background:#fff;
  border-bottom:0;display:none;align-items:center;gap:14px;padding:0 16px}
body.lsRecolhe #lsTopo{display:flex}
#lsTopo .lsLogoTopo{height:19px;width:auto;display:block}
/* o setor fica colado na marca, separado por um fio — é a mesma
   hierarquia que a tela tinha por dentro, agora só no topo */
#lsSetor{display:flex;align-items:center;gap:11px;font-size:13.5px;font-weight:600;
  color:#1D1D22;letter-spacing:-.015em}
#lsSetor::before{content:'';width:1px;height:17px;background:#E2E2E8;display:block}
/* ⭐ OPÇÃO A, aprovada: o botão mora na casca, então aparece em toda tela */
#lsCadastrar{margin-left:auto;height:34px;padding:0 16px;border:0;border-radius:11px;
  background:#FF2D87;color:#fff;cursor:pointer;font-family:inherit;
  font:600 13.5px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.01em}
#lsCadastrar:hover{background:#F01A77}
/* ══ AS AÇÕES DO CAIXA, na pílula escura da referência ════════════════
   «Caixa em dinheiro» e «Estorno» viviam flutuando por cima da tela, um
   verde e um laranja — duas cores que não existem em mais nenhum canto
   da marca. Agrupadas aqui, viram a mesma peça da referência (pílula
   #0A080B, item em branco) sem cobrir uma linha sequer do painel. */
/* ⚠️ Ela, 12/11: *«seguir o padrão do botão cadastrar novo procedimento
   pra todos os botões da tela, e cores sempre vivas»*. Estes dois eram
   transparentes dentro de uma pílula escura — dois botões «vazios» num
   grupo. Agora seguem a régua medida do `#lsCadastrar` (raio 11px, 34px
   de altura, 600/13,5px) em TINTA sólida: mesma forma da ação principal,
   cor diferente porque o papel é outro.
   ⚠️ E isto mora AQUI, na casca: o `ls-premium.css` carrega dentro do
   iframe do caixa e nunca alcançaria a barra — foi o que fez a primeira
   tentativa não pegar. */
#lsAcoes{display:flex;align-items:center;gap:8px;margin-left:auto;padding:0;background:none}
#lsAcoes button{height:34px;padding:0 16px;border:0;border-radius:11px;background:#0D0D10;
  color:#fff;cursor:pointer;font-family:inherit;font-size:13.5px;font-weight:600;
  letter-spacing:-.01em;white-space:nowrap;transition:background .14s ease}
#lsAcoes button:hover{background:#000}
#lsAcoes .fio{display:none}
#lsCadastrar{margin-left:12px}
#lsTopo .lsTela{margin-left:-3px;font-size:13.5px;color:#8A8A94;letter-spacing:-.015em}
/* o ponto só existe quando há nome de sub-tela depois dele —
   senão a barra mostrava «Financeiro ·» com o ponto no vazio */
#lsTopo .lsTela:not(:empty)::before{content:'· ';color:#C9C9D2}

/* ══ A BARRA NO CELULAR ════════════════════════════════════════════════
   ⚠️ Em 390px os três botões não cabem de jeito nenhum: só «Caixa em
   dinheiro» + «Estorno» + «+ Cadastrar procedimento» passam de 420px de
   texto. A regra da referência é clara — no telefone, o que é
   secundário vira ícone ou sai. Aqui as duas ações do caixa saem da
   barra (continuam no menu, pelo mesmo caminho) e fica a ação
   principal, encolhida para o «+». */
@media (max-width:760px){
  /* ⚠️ O `#abrir` é o botão de menu ANTIGO, que a casca mostrava abaixo
     de 1024px. Com a barra nova ele virou um retângulo escuro solto
     logo abaixo dela — dois hambúrgueres na mesma tela, um deles
     meio escondido. Quem abre o menu agora é o da barra. */
  #abrir{display:none!important}
  #lsTopo{height:52px;padding:0 12px;gap:10px}
  #lsAcoes{display:none}
  #lsSetor{font-size:12.5px}
  #lsSetor::before{height:14px}
  #lsTopo .lsLogoTopo{height:17px}
  #lsCadastrar{margin-left:auto;width:38px;height:38px;padding:0;border-radius:12px;
    font-size:0;display:flex;align-items:center;justify-content:center}
  #lsCadastrar::after{content:'+';font-size:22px;font-weight:400;line-height:1}
  body.lsRecolhe #palco{padding-top:52px}
  body.lsRecolhe #palco iframe{top:52px;height:calc(100% - 52px)}
  body.lsRecolhe #lado{top:52px}
  body.lsRecolhe.lsAberta #lado{top:52px;height:calc(100% - 52px);width:min(86vw,300px)}
}
/* ⚠️ `padding-top` no #palco NÃO empurra as telas: os iframes são
   `position:absolute; inset:0`, e um absoluto se ancora no PADDING BOX
   do pai — ou seja, ele começa debaixo do padding, não depois dele.
   O resultado era a barra da marca tapando os 46px de cima de TODA
   tela do sistema. Quem desloca um absoluto é `top`, não padding.
   (Achado por um clique que não chegou no botão: o Playwright disse
   «#lsTopo intercepts pointer events».) */
body.lsRecolhe #palco{padding-left:0}
/* ⚠️ E `top:46px` sozinho não bastava: o `#palco iframe` declara
   `height:100%` explícito, que vence o `bottom:0` do inset. O iframe
   descia 46px e continuava com 100% de altura — vazava 46px para fora da
   janela e comia o rodapé de toda tela (foi o botão «Cadastrar
   procedimento» saindo pela borda de baixo que mostrou isso). */
body.lsRecolhe #palco iframe{top:46px;height:calc(100% - 46px)}
body.lsRecolhe #lsPontos{position:static;width:34px;height:34px;border-radius:10px}
body.lsRecolhe.lsAberta #lsPontos{left:auto}
body.lsRecolhe #lado{top:46px}
body.lsRecolhe.lsAberta #lado{top:46px;height:calc(100% - 46px)}
body.lsRecolhe.lsAberta #lsVeu{display:block}
</style></head>
<body>

<button id="abrir" onclick="document.body.classList.toggle('menu')" aria-label="Menu">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
</button>
<div id="veu" onclick="document.body.classList.remove('menu')"></div>

<nav id="lado">
  <!-- ⚠️ Ela, 12/11: *«na barra de menu aparece uma sequência de duas
       logos, nada bonito»*. E aparecia mesmo: a lateral tinha a logo e,
       a 16px dela, a barra fixa tinha a mesma logo de novo — a mesma
       marca duas vezes na mesma faixa horizontal. A barra fixa é quem
       fica; aqui sobra o espaço, que o menu usa para respirar. -->

  <!-- ⚠️ A logo saía daqui (a barra fixa já tem a dela) e a faixa de
       88px ficou vazia — um buraco branco no alto do menu, que é pior
       que a repetição que eu tinha ido consertar. A faixa saiu junto; a
       busca encosta no topo, com o respiro que já tinha. -->
  <div id="busca" style="padding-top:18px"><label class="cx">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
      stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="q" type="search" placeholder="Buscar tela…" oninput="pintar(this.value)">
  </label></div>
  <div id="menu"></div>
  <div id="pe"><b id="pe-salao">Salão demonstração</b>os dados deste sistema ficam separados</div>
</nav>

<div id="lsTopo">
  <button id="lsPontos" title="abrir o menu"><i></i><i></i><i></i></button>
    <img class="lsLogoTopo" src="marca-clara.png" alt="laila salon">
  <span id="lsSetor"></span>
  <span class="lsTela" id="lsTela"></span>
  <span id="lsAcoes" hidden>
    <button onclick="noCaixa('abrirCaixaDinheiro')">Caixa em dinheiro</button>
    <span class="fio"></span>
    <button onclick="noCaixa('estornoAbrir')">Estorno</button>
  </span>
  <button id="lsCadastrar" onclick="cadastrarProcedimento()">+ Cadastrar procedimento</button>
</div>

<main id="palco"><div id="carregando">abrindo…</div></main>

<script src="ls-conta.js"></script>
<script>
/* ⚠️ A PORTA, antes de qualquer tela montar. Se não há conta ou o prazo
   acabou, a pessoa vai para `entrar.html` — e o `replace` é de propósito:
   com `href` o botão «voltar» traria ela de volta para dentro. */
if (!window.LS_CONTA || !LS_CONTA.exigirEntrada()) {
  document.documentElement.style.visibility = 'hidden';
}
</script>
<script src="ls-trava.js"></script>
<script>
/* ⭐ PDV E PAINEL DA EQUIPE VIRARAM UM ITEM SÓ (ela, 08/11): *"pdv e painel da
   equipe é a mesma coisa, transforme em pdv"*. É o mesmo aplicativo — o PDV
   abre no painel do dia. Dois nomes para a mesma tela faziam a lateral
   prometer duas coisas e entregar uma. */
const SETORES = [
  {r:'Atendimento', itens:[
    {k:'pdv',      r:'PDV',          u:'pdv/index.html?aba=fluxo2',
     i:'<rect x="2.5" y="11" width="19" height="9" rx="2.2"/><rect x="7" y="4" width="10" height="5.5" rx="1.6"/><path d="M6 14.5h2M11 14.5h2M16 14.5h2"/>'},
    {k:'agenda',   r:'Agenda',       u:'interno/gestor.html#agenda',
     i:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>'},
    {k:'clientes', r:'Clientes',     u:'pdv/index.html?aba=clientes',
     i:'<path d="M16 20v-1.6a3.4 3.4 0 0 0-3.4-3.4H6.4A3.4 3.4 0 0 0 3 18.4V20"/><circle cx="9.5" cy="7.5" r="3.4"/><path d="M21 20v-1.6a3.4 3.4 0 0 0-2.6-3.3"/>'}
  ]},
  /* ⚠️ Ela, 12/11: *«remove do sistema as abas Metas, Fechamento,
     Auditoria e Retoques»*. As quatro saíram daqui — e, com elas, o
     Financeiro ficou com o que já está de pé: o Caixa do dia, os
     Serviços que nasceram dentro dele, e a Conciliação. */
  {r:'Financeiro', itens:[
    {k:'caixa',    r:'Caixa do dia', u:'interno/caixa.html',
     i:'<path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>'},
    {k:'servicos', r:'Serviços',     u:'interno/servicos.html',
     i:'<path d="M6.5 3.5l11 11"/><path d="M17.5 3.5l-11 11"/><circle cx="5" cy="18" r="2.4"/><circle cx="19" cy="18" r="2.4"/>'},
    {k:'concilia', r:'Conciliação',  u:'interno/conciliacao.html',
     i:'<path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>'}
  ]},
  {r:'Gestão', itens:[
    {k:'equipe',   r:'Equipe',       u:'interno/gestor.html#equipe',
     i:'<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/>'},
    {k:'estoque',  r:'Estoque',      u:'interno/gestor.html#estoque',
     i:'<path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96L12 12.01l8.73-5.05"/>'},
    {k:'satisf',   r:'Satisfação',   u:'interno/gestor.html#satisfacao',
     i:'<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01z"/>'},
    {k:'chamados', r:'Chamados',     u:'interno/gestor.html#chamados',
     i:'<path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'},
    {k:'juridico', r:'Jurídico',     u:'interno/gestor.html#juridico',
     i:'<path d="M12 3v18"/><path d="M8 21h8M5 7h14"/><path d="M5 7l-3 6h6zM19 7l-3 6h6z"/>'}
  ]},
  /* ⚠️ MARKETING AINDA NÃO TEM TELA. Entram desabilitados e marcados: menu
     que promete tela inexistente é descoberto pelo cliente que comprou. */
  {r:'Marketing', itens:[
    {k:'campanhas',r:'Campanhas',    novo:true, i:'<path d="M3 11l18-8v18l-18-8z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>'},
    {k:'funis',    r:'Funis',        novo:true, i:'<path d="M3 4h18l-7 8v7l-4 2v-9z"/>'},
    {k:'conteudo', r:'Conteúdo',     novo:true, i:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/>'},
    {k:'indica',   r:'Indicação',    novo:true, i:'<circle cx="8" cy="8" r="3.4"/><circle cx="17" cy="16" r="3.4"/><path d="M10.6 10.3l3.8 3.4"/>'}
  ]}
];
/* ⚠️⚠️ ESTE ARRAY FOI RECONSTRUÍDO À MÃO depois de um estrago meu: usei
   um regex com `.*?` em DOTALL para tirar quatro itens, e ele atravessou
   as linhas, colapsou os TRÊS setores num só e levou junto o «Caixa do
   dia» e a «Equipe». O teste pegou («só Caixa do dia e Serviços abrem →
   servicos»), mas o certo era não ter usado regex em estrutura aninhada:
   lista de itens se edita item a item, não por padrão de texto. */

const LIBERADAS = ['caixa', 'servicos'];
const TODOS = SETORES.flatMap(s => s.itens);
const svg = d => `<svg viewBox="0 0 24 24" width="18" height="18" fill="none"
  stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
/* o cadeado usa o mesmo traço dos ícones do menu: 1,7px, ponta redonda */
const CADEADO = `<svg class="cad" viewBox="0 0 24 24" width="14" height="14" fill="none"
  stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <rect x="4.5" y="10.5" width="15" height="10" rx="2.4"/>
  <path d="M8 10.5V7.8a4 4 0 0 1 8 0v2.7"/></svg>`;

const menu = document.getElementById('menu');
const palco = document.getElementById('palco');
const quadros = {};
let ativo = null;

/* ⚠️ a busca ignora acento: quem digita "satisfacao" tem que achar
   "Satisfação", senão a busca só serve pra quem já sabe escrever certo */
const sa = t => t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function pintar(termo){
  const t = sa(termo || '');
  let achou = 0;
  menu.innerHTML = SETORES.map(s => {
    const itens = s.itens.filter(it => !t || sa(it.r).includes(t));
    if(!itens.length) return '';
    achou += itens.length;
    return `<div class="cab">${s.r}</div>` + itens.map(it => {
      const travada = !it.novo && !LIBERADAS.includes(it.k);
      return `<button class="item${it.k===ativo?' on':''}${travada?' travada':''}"
        data-k="${it.k}" ${(it.novo||travada)?'disabled':`onclick="ir('${it.k}')"`}
        ${travada?'title="em rebranding — abre quando a tela estiver pronta"':''}>
        ${svg(it.i)}<span>${it.r}</span>
        ${it.novo?'<em class="breve">em breve</em>':''}
        ${travada?CADEADO:''}</button>`;
    }).join('');
  }).join('');
  if(!achou) menu.innerHTML = `<div class="vazio">Nenhuma tela com “${termo}”.</div>`;
}

/* ⚠️ O IFRAME NASCE NO PRIMEIRO CLIQUE E NUNCA MAIS MORRE. Recriar a cada
   troca faria o PDV reler o banco inteiro toda vez que ela saísse e voltasse —
   e perderia a comanda aberta na tela. Trocar de aba aqui é só esconder. */
function ir(k){
  const it = TODOS.find(x => x.k === k);
  if(!it || !it.u) return;
  if(!quadros[k]){
    const f = document.createElement('iframe');
    f.src = it.u; f.title = it.r; quadros[k] = f; palco.appendChild(f);
  }
  Object.values(quadros).forEach(f => f.classList.remove('on'));
  quadros[k].classList.add('on');
  ativo = k;
  document.querySelectorAll('.item').forEach(b => b.classList.toggle('on', b.dataset.k === k));
  const c = document.getElementById('carregando'); if(c) c.remove();
  document.body.classList.remove('menu');
  if(location.hash.slice(1) !== k) history.replaceState(null, '', '#' + k);
  document.title = it.r + ' · Laila Salon';
  /* ⚠️ Ela, 12/11: *«remove · Caixa do dia da escrita no topo»*. O nome
     da ABA saiu — a lateral já diz onde ela está e o painel tem o
     próprio cabeçalho. O `#lsTela` continua existindo para as SUB-telas
     (o «Cadastro de procedimento», que não é aba nenhuma e precisa se
     anunciar); por isso ele é esvaziado aqui, não removido. */
  const nome = document.getElementById('lsTela'); if(nome) nome.textContent = '';
  /* o setor sai da própria lista de SETORES: nunca escrevo o nome à mão */
  const setor = SETORES.find(s => s.itens.some(x => x.k === k));
  const alvo = document.getElementById('lsSetor');
  if (alvo) alvo.textContent = setor ? setor.r : '';
  /* as duas ações são do caixa: em outra aba elas não fazem sentido */
  const ac = document.getElementById('lsAcoes');
  if (ac) ac.hidden = (k !== 'caixa');
}

/* ⭐ O botão da barra abre Serviços e, de lá, o cadastro — assim existe
   UM caminho só para a calculadora, e não dois que podem divergir. */
/* chama a função que mora dentro da tela do caixa — mesma origem, então
   o acesso é direto; o `try` cobre a tela ainda carregando */
function noCaixa(fn){
  try { const w = quadros['caixa']?.contentWindow;
    if (w && typeof w[fn] === 'function') w[fn](); } catch(e){}
}

function cadastrarProcedimento(){
  const jaEm = ativo === 'servicos';
  ir('servicos');
  const tenta = (n) => {
    const f = quadros['servicos'];
    const w = f && f.contentWindow;
    if (w && typeof w.abrirCadastro === 'function') { w.abrirCadastro(); return; }
    if (n < 40) setTimeout(() => tenta(n+1), 120);   /* a tela ainda está carregando */
  };
  setTimeout(() => tenta(0), jaEm ? 0 : 160);
}

document.getElementById('pe-salao').textContent =
  window.LS_SALAO === 'demo' ? 'Salão demonstração' : 'Salão ' + window.LS_SALAO;

pintar('');
ir(TODOS.find(x => x.k === location.hash.slice(1) && x.u) ? location.hash.slice(1) : 'caixa');
addEventListener('hashchange', () => {
  const k = location.hash.slice(1);
  if(TODOS.find(x => x.k === k && x.u)) ir(k);
});
</script>
<div id="lsVeu"></div>
<script>
/* ⚠️ RECOLHIDA POR PADRÃO, e o estado fica guardado: se ela abrir e
   recarregar, continua como ela deixou. */
(function(){
  const b=document.body; b.classList.add('lsRecolhe');
  try{ if(localStorage.getItem('ls_menu')==='aberto') b.classList.add('lsAberta'); }catch(e){}
  const liga=()=>{ b.classList.toggle('lsAberta');
    try{ localStorage.setItem('ls_menu', b.classList.contains('lsAberta')?'aberto':'fechado'); }catch(e){} };
  document.getElementById('lsPontos').onclick=liga;
  document.getElementById('lsVeu').onclick=liga;
  /* escolher uma tela fecha o menu — senão ele fica por cima do que ela abriu */
  document.getElementById('menu').addEventListener('click',e=>{
    if(e.target.closest('button,a')) b.classList.remove('lsAberta');
  });
})();
</script></body>
